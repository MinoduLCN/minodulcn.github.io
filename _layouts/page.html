---
layout: default
---
<div class="wrapper page">
  <article class="post">

    <header class="post-header">
      <h1 class="post-title">{{ page.heading_title | default: page.title | escape }}</h1>
    </header>


    <nav class="toc">
      <h2>Contents</h2>
      {% include toc.html html=content %}
    </nav>
    <script>
      window.addEventListener("load", () => {
        const target = document.querySelector('.toc');
        const sentinel = document.querySelector('#bottom-sentinel');

        const observer = new IntersectionObserver(([entry]) => {
          target.classList.toggle('hidden', entry.isIntersecting);
        });

        observer.observe(sentinel);
      })
      
    </script>

    <div class="post-content">
      {{ content }}
    </div>

  </article>
</div>
